name: Deploy AppCuaca to GitHub Pages

on:
  push:
    branches:
      - tugaspbpb

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil source code
        uses: actions/checkout@v6

      - name: Menginstall Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Menginstall dependencies
        run: npm ci

      - name: Build aplikasi
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload hasil build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4